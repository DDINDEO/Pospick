spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pospick?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # 자바 코드를 보고 DB 테이블을 자동으로 생성/수정
    show-sql: true     # 실행되는 SQL문을 콘솔에 보여줌
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:pospick-secret-key-must-be-at-least-32-characters-long}
  expiration: 86400000 # 24시간 (밀리초)

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    region: ap-northeast-2
    bucket: pospick-images

gemini:
  api-key: ${GEMINI_API_KEY}